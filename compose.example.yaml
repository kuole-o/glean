# 🚀 Glean — 拾句 · Self-hosted sentence management service
# ================================================================
# Copy this file to docker-compose.yaml and fill in your settings.
# 复制此文件为 docker-compose.yaml 并填入你的配置。
# ================================================================
#
# Quick start / 快速启动:
#   docker compose up -d
#
# Default admin login / 默认管理后台:
#   http://your-host:37292  (user: root / 密码见下方 AUTH_PASSWORD，必须自行设置)

version: "3.8"

services:
  glean:
    build: .
    image: glean:latest
    container_name: glean
    restart: always
    ports:
      # HOST_PORT:CONTAINER_PORT — change the left side if 37292 conflicts
      # 左侧端口如冲突可自行修改
      - "37292:6689"
    volumes:
      # Persist SQLite database on the host
      # SQLite 数据库持久化到宿主机
      - "./data:/app/data"
    environment:
      # ---- Core / 核心 ----
      - NODE_ENV=production
      - PORT=6689

      # ---- Redis Cache (optional / 可选; comment out to disable / 注释掉即关闭) ----
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=your-redis-password          # uncomment if Redis auth is enabled
      - REDIS_DB=1
      - CACHE_TTL=60                                  # seconds / 秒

      # ---- Categories / 分类列表 ----
      # Comma-separated list. Uncomment to customize / 逗号分隔，取消注释自定义
      - CATEGORIES=原创,动画,歌词,游戏,文学,网络,影视,诗词,哲学,抖机灵,其他

      # ---- CORS ----
      - CORS_ORIGIN=* # https://example.com

      # ---- Site Footer / 页脚 ----
      # - SITE_ICP=粤ICP备XXXXXXXX号-X
      # - SITE_AUTHOR=YourName
      # - SITE_YEAR=2025
      - SITE_COPYRIGHT=true

      # ---- Auth / 管理后台登录 ----
      - AUTH_USERNAME=root              # change it! / 请修改！
      - AUTH_PASSWORD=change-me         # 强烈建议修改！默认密码仅告警不拦截 / warns but still starts if left default
      - JWT_SECRET=please-generate-a-32-byte-hex   # 固定密钥，避免重启后掉登录 / keep tokens valid across restarts
      # - TOKEN_EXPIRY=24h              # 令牌有效期 / token lifetime

      # ---- Security / 安全加固（公网部署建议开启）----
      # 反代真实 IP：Lucky/Nginx 等反代后，容器看到的源 IP 是代理的 LAN 地址，
      # 必须让 glean 从转发头还原真实客户端 IP，否则限流/防暴力会把所有人算作一个 IP。
      # 推荐用 TRUSTED_PROXY_IPS 锁定可信代理（防局域网内伪造），而非无条件的 TRUST_PROXY。
      # 填你的反代来源 IP
      - TRUSTED_PROXY_IPS=192.168.1.1   # your reverse-proxy LAN IP(s), comma-separated; supports CIDR
      # - TRUST_PROXY=true                # 简单模式(无条件信任转发头)，仅当 glean 端口不对外暴露时用
      # 诊断：首次部署后临时设为 true，从手机 4G 访问 /api/whoami 确认反代传了真实 IP，之后请关闭
      # - WHOAMI_ENABLED=true
      - RATE_LIMIT_ENABLED=true         # 全局接口限流（含随机文案接口）/ global rate limit
      - RATE_LIMIT_WINDOW=60            # 限流窗口（秒）/ window in seconds
      - RATE_LIMIT_MAX=120             # 单 IP 窗口内最大请求数 / max requests per IP per window
      - LOGIN_LOCKOUT_ENABLED=true      # 登录暴力破解锁定 / brute-force lockout
      - LOGIN_MAX_FAILS=5               # 连续失败次数触发锁定 / fails before lockout
      - LOGIN_LOCKOUT_WINDOW=900        # 锁定时长（秒）/ lockout duration
